name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: cargo test --workspace

      # The action installs the Solana and the Anchor toolchains, the anchor
      # command itself is a separate step so that a wallet can be created in
      # between.
      - name: Install the Solana and Anchor toolchains
        uses: coral-xyz/anchor@v0.32.2
        with:
          args: --version

      - name: Create the test wallet
        run: solana-keygen new --no-bip39-passphrase --outfile ~/.config/solana/id.json --force

      # `anchor test` starts a local validator, deploys the program and runs
      # the TypeScript integration suite against it.
      - name: Integration tests
        uses: coral-xyz/anchor@v0.32.2
        with:
          args: test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Build the program
        uses: coral-xyz/anchor@v0.32.2
        with:
          args: build

      - name: Upload the IDL
        uses: actions/upload-artifact@v4
        with:
          name: idl
          path: target/idl
          if-no-files-found: error
