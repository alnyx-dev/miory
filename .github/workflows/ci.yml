name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read
  # audit-check пишет результат аудита как check-run.
  checks: write

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: TypeScript
        run: npx tsc --noEmit -p tsconfig.json

      # Проверка зависимостей на известные уязвимости (RustSec Advisory DB).
      - name: Audit the dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install the Solana and Anchor toolchains
        run: bash scripts/ci/install-toolchain.sh

      - name: Create the test wallet
        run: solana-keygen new --no-bip39-passphrase --outfile ~/.config/solana/id.json --force

      - name: Unit tests
        run: cargo test --workspace

      # `anchor test` starts a local validator, deploys the program and runs
      # the TypeScript integration suite against it.
      - name: Integration tests
        run: anchor test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install the Solana and Anchor toolchains
        run: bash scripts/ci/install-toolchain.sh

      - name: Build the program
        run: anchor build

      - name: Upload the IDL
        uses: actions/upload-artifact@v4
        with:
          name: idl
          path: target/idl
          if-no-files-found: error
